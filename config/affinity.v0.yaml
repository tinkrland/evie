# structural affinity, versioned. every knob lives here, never in a code
# constant. changing any value is a config version bump and changes the
# output hash (see docs/affinity.md).
version: affinity.v0

scoring:
  # cosine over work incidence: shared works / sqrt(support_a * support_b)
  score: cosine_incidence
  min_score: 0.0
  # a pair must appear in at least this many works to be published.
  # 1 is honest at catalogue sizes where most pairs are seen once; raise
  # it when the catalogue grows and start reporting what drops out.
  min_pair_works: 1
  top_k: 8
  score_rounding_decimals: 6

# values that are never evidence: the prime-directive sentinels.
exclude_values:
- unknown
